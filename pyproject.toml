[project]
name = "auto-adapter"
version = "0.1.0"
description = "ModelHub XC adaptation agent: auto-discover and submit model adaptation tasks"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]
redis = ["redis>=5.0"]

[project.scripts]
auto-adapter = "auto_adapter.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
