[project]
name = "auto-adapter"
version = "0.1.0"
description = "ModelHub XC adaptation agent: auto-discover and submit model adaptation tasks"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]
redis = ["redis>=5.0"]

[project.scripts]
auto-adapter = "auto_adapter.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# configParams 模板必须随 wheel 一起安装：容器用 `pip install .`（非 editable 安装），
# 缺了这一节 config_gen.render_config_params 会在生产环境第一次渲染时抛
# FileNotFoundError，整条流水线在 submitter 之前就中断（tests/test_packaging.py 守护）。
[tool.setuptools.package-data]
auto_adapter = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
