# vllm 场景 configParams 模板（spec 附录 A.1.1，与平台官方样例结构一致）。
# 占位符 {tp_size}/{max_model_len}/{gpu_mem_util} 由 config_gen 填充后
# 整体序列化为 YAML 字符串放入 configParams 字段。
# 引擎失败重试可调：gpu_num/-tp（sut 与 ref 保持一致）、gpu-memory-utilization、max_model_len。
framework: vllm
api: completion
lang: en
max_model_len: {max_model_len}
max_tokens: 1024
temperature: 0.7
repetition_penalty: 1.1
top_p: 0.9
sut_config:
  gpu_num: {tp_size}
  values:
    command:
      - /opt/conda/bin/vllm
      - serve
      - /model
      - --port
      - "20644"
      - --served-model-name
      - llm
      - --max-model-len
      - "{max_model_len}"
      - --gpu-memory-utilization
      - "{gpu_mem_util}"
      - -tp
      - "{tp_size}"
      - --enforce-eager
      - --trust-remote-code
ref_config:
  gpu_num: {tp_size}
  values:
    command:
      - vllm
      - serve
      - /model
      - --port
      - "80"
      - --served-model-name
      - llm
      - --max-model-len
      - "{max_model_len}"
      - -tp
      - "{tp_size}"
      - --enforce-eager
      - --trust-remote-code
